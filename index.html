<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractal Rendering</title>    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section id="menu">
        <header class="brand">
          <h1>Julia Fractal</h1>
        </header>

        <div class="controls">
          <div class="field">
            <label for="cR">Constant Real (Cr)</label>
            <input type="number" id="cR" step="0.01" value="-0.8" />
          </div>

          <div class="field">
            <label for="cI">Constant Imaginary (Ci)</label>
            <input type="number" id="cI" step="0.01" value="0.156" />
          </div>

          <div class="field">
            <label for="iterations">Iterations</label>
            <input type="number" id="iterations" step="1" value="500" />
          </div>

          <div class="field toggle">
            <span>Animate C</span>
            <input type="checkbox" id="variableC" />
          </div>

          <div class="field toggle">
            <span>Adaptive quality</span>
            <input type="checkbox" id="adaptiveQuality" />
          </div>

          <div class="field field-range">
            <div class="range-header">
              <label for="adaptiveHysteresis">Hysteresis</label>
              <span id="adaptiveHysteresisValue">0.14</span>
            </div>
            <input
              type="range"
              id="adaptiveHysteresis"
              min="0.05"
              max="0.35"
              step="0.01"
              value="0.14"
              disabled
            />
          </div>

          <div class="actions">
            <button id="applyChanges">Apply</button>
            <button id="cancelChanges">Reset</button>
          </div>
        </div>

        <footer class="help">
          Zoom with mouse wheel. Pan by dragging on the canvas.
        </footer>
      </section>

      <section class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
